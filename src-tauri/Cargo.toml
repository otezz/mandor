[package]
name = "mandor"
version = "0.6.1"
description = "A fast, light desktop GUI for managing interactive claude terminal sessions"
authors = ["otezz"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
base64 = "0.22.1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# Cross-platform system-font enumeration for the terminal-font picker.
fontdb = "0.23"
# Sent notifications directly (like notify-send): tauri-plugin-notification's
# show() returns Ok on Linux but doesn't raise a banner in this environment.
notify-rust = "4"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "macros"] }
rust-embed = "8.12.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"

# Linux: give dev (debug) builds a distinct Wayland app-id / X11 WM_CLASS so
# they aren't grouped with an installed release build in the taskbar.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
