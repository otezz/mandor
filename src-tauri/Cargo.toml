[package]
name = "mandor-term"
version = "0.1.0"
description = "A fast, light desktop GUI for managing interactive claude terminal sessions"
authors = ["otezz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
base64 = "0.22.1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

# Linux: give dev (debug) builds a distinct Wayland app-id / X11 WM_CLASS so
# they aren't grouped with an installed release build in the taskbar.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
